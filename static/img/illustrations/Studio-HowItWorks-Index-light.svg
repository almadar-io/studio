<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  
    <!-- Describe -->
    <rect x="150" y="130" width="100" height="100" rx="16" fill="#edf6f9" stroke="#0077b6" stroke-width="4"/>
    <circle cx="200" cy="180" r="15" fill="#0077b6"/>
    
    <!-- Validate -->
    <rect x="350" y="50" width="100" height="100" rx="16" fill="#edf6f9" stroke="#00b4d8" stroke-width="4"/>
    <polygon points="400,80 420,110 380,110" fill="#00b4d8"/>
    
    <!-- Compile -->
    <rect x="550" y="130" width="100" height="100" rx="16" fill="#edf6f9" stroke="#0077b6" stroke-width="4"/>
    <rect x="585" y="165" width="30" height="30" fill="#0077b6"/>
    
    <!-- Deploy -->
    <rect x="350" y="210" width="100" height="100" rx="16" fill="#edf6f9" stroke="#00b4d8" stroke-width="4" filter="url(#glow)"/>
    <circle cx="400" cy="260" r="20" fill="#00b4d8"/>

    <!-- Circular Arrows -->
    <path d="M250 150 Q300 100 350 100" fill="none" stroke="#0077b6" stroke-width="4" stroke-dasharray="8 4"/>
    <path d="M450 100 Q500 100 550 150" fill="none" stroke="#00b4d8" stroke-width="4" stroke-dasharray="8 4"/>
    <path d="M550 210 Q500 260 450 260" fill="none" stroke="#0077b6" stroke-width="4" stroke-dasharray="8 4"/>
    <path d="M350 260 Q300 260 250 210" fill="none" stroke="#00b4d8" stroke-width="4" stroke-dasharray="8 4"/>
  
</svg>